<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D5E8"/>
      <stop offset="100%" style="stop-color:#E0B8D5"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C47DB8"/>
      <stop offset="100%" style="stop-color:#9E5A9E"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Outer sync ring arc (270°, leaving gap at bottom-right for arrow) -->
  <path d="M 256 100 A 156 156 0 1 1 368 378"
        fill="none" stroke="url(#icon)" stroke-width="46"
        stroke-linecap="round"/>

  <!-- Arrowhead at end of arc (bottom-right, pointing down-left) -->
  <g transform="translate(368,378) rotate(135)">
    <polygon points="0,-38 33,22 -33,22" fill="url(#icon)"/>
  </g>

  <!-- Second arc on opposite side (small, for double-sync feel) -->
  <path d="M 256 412 A 156 156 0 0 1 144 134"
        fill="none" stroke="url(#icon)" stroke-width="46"
        stroke-linecap="round" opacity="0.4"/>

  <!-- Center moon crescent -->
  <circle cx="256" cy="256" r="62" fill="url(#icon)" opacity="0.85"/>
  <circle cx="278" cy="240" r="52" fill="url(#bg)"/>

</svg>
