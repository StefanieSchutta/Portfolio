<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FEF3DC"/>
      <stop offset="100%" style="stop-color:#F8DCBC"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F4A96A"/>
      <stop offset="100%" style="stop-color:#E07A3C"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F9C06A"/>
      <stop offset="100%" style="stop-color:#E8924E"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bg)"/>

  <!-- Soft outer glow petals (8 rounded rays) -->
  <g transform="translate(256,256)">
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(0)   translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(45)  translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(90)  translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(135) translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(180) translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(225) translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(270) translate(0,-148)"/>
    <ellipse rx="28" ry="70" fill="url(#sun)" opacity="0.45" transform="rotate(315) translate(0,-148)"/>
  </g>

  <!-- Middle ring - softer petals -->
  <g transform="translate(256,256)">
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(22.5)  translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(67.5)  translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(112.5) translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(157.5) translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(202.5) translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(247.5) translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(292.5) translate(0,-107)"/>
    <ellipse rx="22" ry="50" fill="url(#sun)" opacity="0.65" transform="rotate(337.5) translate(0,-107)"/>
  </g>

  <!-- Center sun circle -->
  <circle cx="256" cy="256" r="88" fill="url(#center)"/>

  <!-- Soft inner highlight -->
  <circle cx="232" cy="232" r="36" fill="white" opacity="0.22"/>

</svg>
